{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4F46E5">
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <title>Login - Tres Cerritos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/mobile.css' %}">
  <style>
    body { background: var(--primary); color: white; display: flex; flex-direction: column; justify-content: center; height: 100vh; padding: 20px; box-sizing: border-box; }
    .login-container { background: var(--surface); padding: 24px; border-radius: 16px; color: var(--text-main); text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    .login-title { margin-top: 0; margin-bottom: 24px; font-size: 1.5rem; }
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-muted); }
    .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: var(--primary); ring: 2px var(--primary); }
    .error-msg { color: var(--status-critical); font-size: 0.875rem; margin-bottom: 16px; background: #FEE2E2; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1 class="login-title">Tres Cerritos Acceso</h1>
    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="post" action="{% url 'mobile_login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Ingresar</button>
    </form>
  </div>
</body>
</html>
